name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          uv pip install --system -e ".[dev]"

      - name: Ruff Linter
        run: |
          ruff check backend

      - name: Ruff Formatter Check
        run: |
          ruff format --check backend

      - name: Mypy Typecheck
        run: |
          mypy backend/app

      - name: Pytest Suite
        run: |
          pytest backend/tests
